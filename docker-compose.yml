services:
  mcp:
    image: ghcr.io/ararahq/mcp:${MCP_IMAGE_TAG:-latest}
    build: .
    container_name: ararahq-mcp
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - MCP_TRANSPORT=http
      - MCP_PUBLIC_URL=${MCP_PUBLIC_URL:-https://mcp.ararahq.com/mcp}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-mcp.ararahq.com}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-https://chatgpt.com,https://claude.ai}
      - ARARA_OAUTH_ISSUER=${ARARA_OAUTH_ISSUER:-https://api.ararahq.com/api}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
