name: Publish @ararahq/mcp to npm

# Manual by design. The first @ararahq/mcp version must be published interactively
# to create the package. After that, npm Trusted Publishing authorizes this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use an OIDC-compatible npm CLI
        run: npm install --global npm@12.0.2

      - name: Install native build dependency
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Publish se a versão for nova
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION já está publicado — nada a fazer."
          else
            echo "Publicando $NAME@$VERSION..."
            npm publish --access public
            echo "Publicado."
          fi
